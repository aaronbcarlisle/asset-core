# assetcore.toml — the ONLY place a studio names its backing services.
#
# Swapping ShotGrid for Jira, or sqlite for postgres, is editing THIS file.
# No application code changes, no conditional in the composition root. Point the
# service at it with ASSETCORE_CONFIG=/path/to/assetcore.toml.
#
# ${VAR} placeholders are expanded from the environment at load, so secrets
# (API keys, DSNs) never live in the file or in version control.

# --- storage repo: which AssetRepo backs the service (audit note #3) -----------
[repos.main]
provider = "sqlite"                 # one of: sqlite | postgres | memory
[repos.main.config]
path = "${ASSETCORE_SQLITE_PATH}"   # empty -> SqliteRepo falls back to :memory:
# to move to Postgres, this block becomes:
#   [repos.main]
#   provider = "postgres"
#   [repos.main.config]
#   dsn = "${ASSETCORE_DSN}"
#   min_conn = 1        # connection pool bounds (optional; defaults 1 / 10)
#   max_conn = 10

# --- event sink: the spine (optional section; omit for the in-process default) --
[sinks.main]
provider = "broadcast"              # one of: broadcast | postgres
[sinks.main.config]
# max_log = 10000                   # broadcast: bounded in-memory log size
# to make the spine durable + multi-process (SSE resume survives restarts):
#   [sinks.main]
#   provider = "postgres"
#   [sinks.main.config]
#   dsn = "${ASSETCORE_DSN}"

# --- auth: who is calling (optional section; omit for the static token map) -----
[auth.main]
provider = "static"                 # one of: static | jwt
[auth.main.config]
# static: tokens come from ASSETCORE_TOKENS (or the dev defaults) unless given here:
# [auth.main.config.tokens]
# "some-token" = "artist"
#
# jwt (verified identity — any OIDC IdP; needs the `auth` extra):
#   [auth.main]
#   provider = "jwt"
#   [auth.main.config]
#   jwks_url = "https://idp.studio.com/.well-known/jwks.json"   # or: secret = "${ASSETCORE_JWT_SECRET}"
#   issuer   = "https://idp.studio.com"
#   audience = "assetcore"
#   roles_claim   = "roles"        # claim holding the caller's roles/groups
#   subject_claim = "sub"          # becomes the VERIFIED actor on writes
#   [auth.main.config.role_map]    # IdP role/group -> authority
#   "pipeline-production" = "production"
#   "artists"             = "artist"
#   "build-farm"          = "build"

# --- production tracker: a VIEW over identity (ShotGrid / Jira / ftrack) --------
[trackers.production]
provider = "shotgrid"               # which TrackerAdapter implementation
[trackers.production.config]
base_url    = "https://studio.shotgrid.autodesk.com"
script_name = "assetcore"
api_key     = "${SHOTGRID_API_KEY}"
project     = "Demo: Game"          # SG Assets are project-scoped (id or name)

# to move to Jira, this whole block becomes:
#   [trackers.production]
#   provider = "jira"
#   [trackers.production.config]
#   base_url  = "https://studio.atlassian.net"
#   project   = "PIPE"
#   email     = "pipeline@studio.com"
#   api_token = "${JIRA_API_TOKEN}"

# --- source / runtime stores: DESCRIBED here for completeness ------------------
# (Perforce/git resolvers still route through ResolverRegistry today; wiring them
#  into this registry is a follow-up — see docs/PROVIDER_LAYER.md "Deferred".)
[source_vcs.main]
provider = "perforce"
[source_vcs.main.config]
port = "perforce:1666"

[runtime_store.main]
provider = "unreal"
[runtime_store.main.config]
project_root = "/Game"
